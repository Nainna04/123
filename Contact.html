<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1220" />
    <title>Contact | Professional Summary</title>
    <style>
      :root {
        --primary: #7dd3fc;
        --text: #e5eefb;
        --muted: #b7c4d9;
        --accent: #a78bfa;
        --line: rgba(255, 255, 255, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        color: var(--text);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #09131d, #0f1d2d 55%, #111827);
      }

      .contact-card {
        width: min(720px, 100%);
        padding: clamp(28px, 7vw, 64px);
        border: 1px solid var(--line);
        border-radius: 24px;
        background: rgba(18, 29, 47, 0.9);
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.55);
      }

      .eyebrow {
        display: inline-block;
        padding: 8px 14px;
        border: 1px solid rgba(125, 211, 252, 0.4);
        border-radius: 999px;
        background: rgba(56, 189, 248, 0.08);
        color: var(--primary);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 22px 0 12px;
        font-size: clamp(2.5rem, 7vw, 4rem);
        letter-spacing: -0.05em;
      }

      .intro {
        margin: 0;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .links {
        display: grid;
        gap: 12px;
        margin: 32px 0;
      }

      .contact-link {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 64px;
        padding: 16px 20px;
        border: 1px solid var(--line);
        border-radius: 14px;
        color: var(--text);
        text-decoration: none;
        background: rgba(255, 255, 255, 0.025);
        transition: border-color 0.2s ease, transform 0.2s ease, background 0.2s ease;
      }

      .contact-link:hover,
      .contact-link:focus-visible {
        transform: translateY(-2px);
        border-color: rgba(125, 211, 252, 0.6);
        background: rgba(125, 211, 252, 0.07);
      }

      .contact-link:focus-visible,
      .back-link:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 4px;
      }

      .link-label {
        font-weight: 700;
      }

      .link-detail {
        color: var(--muted);
        text-align: right;
        overflow-wrap: anywhere;
      }

      .back-link {
        display: inline-flex;
        padding: 10px 0;
        color: var(--primary);
        font-weight: 700;
        text-decoration: none;
      }

      .back-link:hover {
        color: var(--accent);
      }

      @media (max-width: 520px) {
        .contact-link {
          align-items: flex-start;
          flex-direction: column;
          gap: 6px;
        }

        .link-detail {
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <main class="contact-card">
      <span class="eyebrow">Get in touch</span>
      <h1>Contact me</h1>
      <p class="intro">
        For professional opportunities, collaborations, or a friendly hello, reach me by email or
        connect through my social profiles.
      </p>

      <nav class="links" aria-label="Contact and social media links">
        <a class="contact-link" href="mailto:nainnawaziri@gmail.com">
          <span class="link-label">Email</span>
          <span class="link-detail">nainnawaziri@gmail.com</span>
        </a>
        <a class="contact-link" href="https://x.com/aaa" target="_blank" rel="noopener noreferrer">
          <span class="link-label">X</span>
          <span class="link-detail">@aaa</span>
        </a>
        <a class="contact-link" href="https://github.com/qqq" target="_blank" rel="noopener noreferrer">
          <span class="link-label">GitHub</span>
          <span class="link-detail">github.com/qqq</span>
        </a>
      </nav>

      <a class="back-link" href="Home.html">← Back to homepage</a>
    </main>
  </body>
</html>
