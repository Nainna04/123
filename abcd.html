
<!DOCTYPE html>
<html lang="en">
<head>
  <title>JavaScript</title>
</head>
<body>
  <h1>Welcome to My Website</h1>

  <button onclick="showMessage()">
    Click Me
  </button>

  <p id="message"></p>

  <script>
    function showMessage() {
      document.getElementById("message").textContent =
        "JavaScript is working.";
    }
  </script>
</body>
</html>
